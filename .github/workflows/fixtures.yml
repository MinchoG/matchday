name: Update matchday fixtures

on:
  schedule:
    # Morning reconciliation plus a late-night pass after European matches finish.
    - cron: '15 5,23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: matchday-fixtures
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch the latest fixtures and scores
        run: node scripts/update-fixtures.mjs
        env:
          FREE_FOOTBALL_API_TOKEN: ${{ secrets.FREE_FOOTBALL_API_TOKEN }}
      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fixtures.json
          git diff --cached --quiet || git commit -m "data: refresh fixtures and scores"
          git push
      - name: Build production site
        run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=matchday --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
