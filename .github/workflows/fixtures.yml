name: Update matchday fixtures

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matchday-fixtures
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the latest fixtures and scores
        run: node scripts/update-fixtures.mjs
        env:
          FREE_FOOTBALL_API_TOKEN: ${{ secrets.FREE_FOOTBALL_API_TOKEN }}
      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fixtures.json
          git diff --cached --quiet || git commit -m "data: refresh fixtures and scores"
          git push
